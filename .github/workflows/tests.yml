name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: PHP kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # intl BİLEREK KURULMUYOR: paketin varlık sebebi, eklenti olmadan
          # doğru çalışmak. Kurulursa testler bir şeyi kanıtlamaz.
          extensions: mbstring
          coverage: none

      - name: Bağımlılıklar
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Testler
        run: vendor/bin/phpunit
